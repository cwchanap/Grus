[workspace]
members = ["crates/grus-sim", "crates/grus-godot"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "=0.18.1", default-features = false }
godot = "=0.4.5"
godot-bevy = { version = "=0.11.0", default-features = false, features = ["api-4-5", "godot_bevy_log", "experimental-threads"] }
pathfinding = "=4.16.0"
