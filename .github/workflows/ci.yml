name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test simulation
        run: cargo test -p grus-sim
      - name: Build Godot extension
        run: cargo build -p grus-godot
      - name: Stage Godot extension
        run: |
          mkdir -p godot/bin
          cp target/debug/libgrus_godot.so godot/bin/libgrus_godot.so
      - uses: chickensoft-games/setup-godot@v2
        name: Setup Godot 4.6.2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: true
      - name: Verify Godot version
        run: godot --version
      - name: Import Godot project and load extension
        run: timeout 30s godot --headless --path godot --editor --quit-after 120
      - name: Run Godot bridge smoke contract
        run: timeout 45s godot --headless --path godot res://scenes/smoke_test.tscn
      - name: Export Linux x86_64 desktop build
        run: |
          mkdir -p build
          godot --headless --path godot --export-debug "Linux x86_64" ../build/Grus.x86_64
          test -x build/Grus.x86_64
      - name: Verify exported build loads Rust extension
        run: |
          set -o pipefail
          timeout 20s ./build/Grus.x86_64 --headless --quit-after 30 2>&1 | tee export-smoke.log
          grep -q "Initialize godot-rust" export-smoke.log
          ! grep -Eq "Failed to load.*GDExtension|Can't open dynamic library|Cannot open dynamic library" export-smoke.log
      - name: Benchmark 200 moving units at 1080p
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          echo "GRUS_BENCHMARK_HOST"
          uname -a
          lscpu | grep -E 'Architecture|CPU\(s\)|Model name'
          command -v xvfb-run
          set -o pipefail
          timeout 90s xvfb-run -a -s "-screen 0 1920x1080x24" godot --path godot --rendering-method gl_compatibility res://scenes/benchmark_200.tscn 2>&1 | tee benchmark.log
          grep -q "GRUS_BENCHMARK_200 moved=200" benchmark.log
