name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build workspace
        run: cargo build --workspace --locked

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview
      - name: Test simulation with coverage gate
        # --ignore-filename-regex keeps `#[cfg(test)]` module bodies (the
        # `src/*/tests.rs` files) out of the report, so the 90% gate measures
        # gameplay code only.
        run: cargo llvm-cov -p grus-sim --all-targets --fail-under-lines 90 --lcov --output-path lcov.info --locked --ignore-filename-regex 'tests\.rs$'
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: grus-sim-coverage-lcov
          path: lcov.info
          if-no-files-found: warn
      - name: Test grus-godot library
        run: cargo test -p grus-godot --lib --locked
      - name: Test grus-godot e2e selector surface
        # Serialized: these tests mutate process-global env vars (BEVY_E2E,
        # BRP_EXTRAS_PORT).
        run: cargo test -p grus-godot --lib --features e2e --locked -- --test-threads=1

  e2e:
    needs: [rust-build-lint, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build Godot extension
        run: cargo build -p grus-godot --features e2e --locked
      - name: Clippy with e2e feature
        run: cargo clippy -p grus-godot --all-targets --features e2e -- -D warnings
      - name: Stage Godot extension
        run: |
          mkdir -p godot/bin
          cp target/debug/libgrus_godot.so godot/bin/libgrus_godot.so
      - uses: chickensoft-games/setup-godot@v2
        name: Setup Godot 4.6.2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: true
      - name: Verify Godot version
        run: godot --version
      - name: Import Godot project and load extension
        run: timeout 30s godot --headless --path godot --editor --quit-after 120
      - name: Run Godot bridge smoke contract
        run: timeout 45s godot --headless --path godot res://scenes/smoke_test.tscn
      - name: Run fixture reset smoke
        run: timeout 45s godot --headless --path godot res://scenes/reset_test.tscn
      - name: Run HPA-471 economy integration smoke
        # 2x observed CI elapsed (~33s) + 10s, rounded up to a 15s bucket.
        run: timeout 90s godot --headless --path godot res://scenes/economy_smoke_test.tscn
      - name: Export Linux x86_64 desktop build
        run: |
          mkdir -p build
          godot --headless --path godot --export-debug "Linux x86_64" ../build/Grus.x86_64
          test -x build/Grus.x86_64
      - name: Verify exported build loads Rust extension
        run: |
          set -o pipefail
          timeout 20s ./build/Grus.x86_64 --headless --quit-after 30 2>&1 | tee export-smoke.log
          grep -q "Initialize godot-rust" export-smoke.log
          ! grep -Eq "Failed to load.*GDExtension|Can't open dynamic library|Cannot open dynamic library" export-smoke.log
      - name: Run bevy-e2e exported-game test
        env:
          GRUS_E2E_BINARY: ${{ github.workspace }}/build/Grus.x86_64
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 \
          xvfb-run -a cargo test \
            -p grus-godot \
            --features e2e \
            --test e2e_boot \
            --locked \
            -- --test-threads=1
      - name: Benchmark 200 moving units at 1080p
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          echo "GRUS_BENCHMARK_HOST"
          uname -a
          lscpu | grep -E 'Architecture|CPU\(s\)|Model name'
          command -v xvfb-run
          set -o pipefail
          timeout 90s xvfb-run -a -s "-screen 0 1920x1080x24" godot --path godot --rendering-method gl_compatibility res://scenes/benchmark_200.tscn 2>&1 | tee benchmark.log
          grep -q "GRUS_BENCHMARK_200 moved=200" benchmark.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-diagnostics
          path: |
            test_output/**
            export-smoke.log
            benchmark.log
