name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build workspace
        run: cargo build --workspace --locked

  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview
      - name: Test simulation with coverage gate
        # --ignore-filename-regex keeps `#[cfg(test)]` module bodies (the
        # `src/*/tests.rs` files) out of the report, so the 90% gate measures
        # gameplay code only.
        run: cargo llvm-cov -p grus-sim --all-targets --fail-under-lines 90 --lcov --output-path lcov.info --locked --ignore-filename-regex 'tests\.rs$'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: grus-sim-coverage-lcov
          path: lcov.info
          if-no-files-found: warn
      - name: Test grus-godot library
        run: cargo test -p grus-godot --lib --locked
      - name: Test grus-godot e2e selector surface
        # Serialized: these tests mutate process-global env vars (BEVY_E2E,
        # BRP_EXTRAS_PORT).
        run: cargo test -p grus-godot --lib --features e2e --locked -- --test-threads=1

  e2e:
    needs: [rust-build-lint, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build Godot extension
        # Deliberately NON-e2e: this is the .so staged for every smoke, the
        # packaged export and the benchmark, all of which must gate on a
        # clean exit 0. The e2e feature pulls bevy_e2e → bevy_remote
        # (default http) → bevy_tasks/async-io, which spawns a
        # process-global, permanently parked self-waking "async-io" driver
        # thread inside the .so. Godot's shutdown dlclose()s the extension
        # while that eternal .so-resident thread exists — the observed
        # post-marker exit 139. The non-e2e build has no async-io driver
        # (block_on = futures_lite, workers park without self-waking), so
        # anything staged from it can be held to strict exits. The e2e
        # build is compiled and staged separately at the end of the job for
        # the bevy-e2e harness only, which SIGKILLs its exported child and
        # never asserts that child's exit status.
        run: cargo build -p grus-godot --locked
      - name: Clippy with e2e feature
        run: cargo clippy -p grus-godot --all-targets --features e2e -- -D warnings
      - name: Stage Godot extension
        run: |
          mkdir -p godot/bin
          cp target/debug/libgrus_godot.so godot/bin/libgrus_godot.so
          # Pristine non-e2e copy for the failure-path gdb rerun: by then
          # godot/bin holds the e2e build, but the backtrace must exercise
          # the same .so the failed smoke/benchmark step ran.
          cp target/debug/libgrus_godot.so target/libgrus_godot_noe2e.so
      - uses: chickensoft-games/setup-godot@v2
        name: Setup Godot 4.7.1
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - name: Verify Godot version
        run: godot --version
      - name: Import Godot project and load extension
        run: timeout 30s godot --headless --path godot --editor --quit-after 120
      - name: Run Godot bridge smoke contract
        # Strict: the contract marker must print AND godot must exit 0. The
        # former post-marker-139 tolerance tracked the e2e feature's
        # bevy_remote→async-io driver thread racing extension dlclose() at
        # shutdown; the staged .so is now a non-e2e build (see the build
        # step), so any nonzero exit is a real failure.
        run: |
          set -o pipefail
          timeout 45s godot --headless --path godot res://scenes/smoke_test.tscn 2>&1 | tee bridge-smoke.log || rc=$?
          rc=${rc:-0}
          grep -q "GRUS_GODOT_SMOKE_OK" bridge-smoke.log || exit 1
          if [ "$rc" -ne 0 ]; then
            echo "::error::bridge smoke contract held but godot exited $rc"
            exit 1
          fi
      - name: Run fixture reset smoke
        run: |
          set -o pipefail
          timeout 45s godot --headless --path godot res://scenes/reset_test.tscn 2>&1 | tee reset-smoke.log || rc=$?
          rc=${rc:-0}
          grep -q "GRUS_RESET_SMOKE_OK" reset-smoke.log || exit 1
          if [ "$rc" -ne 0 ]; then
            echo "::error::reset smoke contract held but godot exited $rc"
            exit 1
          fi
      - name: Run HPA-471 economy integration smoke
        # 2x observed CI elapsed (~33s) + 10s, rounded up to a 15s bucket.
        run: |
          set -o pipefail
          timeout 90s godot --headless --path godot res://scenes/economy_smoke_test.tscn 2>&1 | tee economy-smoke.log || rc=$?
          rc=${rc:-0}
          grep -q "GRUS_ECONOMY_SMOKE_OK" economy-smoke.log || exit 1
          if [ "$rc" -ne 0 ]; then
            echo "::error::economy smoke contract held but godot exited $rc"
            exit 1
          fi
      - name: Run HPA-472 combat lifecycle smoke
        # ~11s locally at 20x sim speed; 45s sibling smoke bucket with CI
        # runner margin.
        run: |
          set -o pipefail
          timeout 45s godot --headless --path godot res://scenes/combat_lifecycle_smoke_test.tscn 2>&1 | tee combat-smoke.log || rc=$?
          rc=${rc:-0}
          grep -q "GRUS_COMBAT_LIFECYCLE_SMOKE_OK" combat-smoke.log || exit 1
          if [ "$rc" -ne 0 ]; then
            echo "::error::combat smoke contract held but godot exited $rc"
            exit 1
          fi
      - name: Test packaging stale-archive guard
        # Pure-bash contract test: stubs cargo/godot in a scratch repo and
        # asserts a failed package run never leaves a stale release archive.
        run: bash scripts/package_linux_x86_64_test.sh
      - name: Export Linux x86_64 smoke build
        # Exports the smoke-entry variant only, while the non-e2e extension
        # is still staged — the packaged smoke below must gate on exit 0, so
        # it cannot ship the e2e .so (see the build step). The real-main-
        # scene Grus.x86_64 for the bevy-e2e test is exported later, after
        # the e2e rebuild/re-stage.
        # The smoke variant swaps the project's main scene to the bridge smoke
        # scene before exporting: official export templates are compiled with
        # `disable_path_overrides=yes`, so a scene path on the CLI aborts the
        # exported binary outright. A dedicated smoke-entry export is the only
        # way to run that scene from the exported binary. project.godot is
        # restored via mv so later steps see the real main scene.
        run: |
          mkdir -p build
          cp godot/project.godot godot/project.godot.ci-backup
          sed -i 's|res://scenes/main.tscn|res://scenes/smoke_test.tscn|' godot/project.godot
          godot --headless --path godot --export-debug "Linux x86_64" ../build/GrusSmoke.x86_64
          mv godot/project.godot.ci-backup godot/project.godot
          test -x build/GrusSmoke.x86_64
      - name: Verify exported build runs the full bridge smoke contract
        # Runs the smoke-entry export (main scene = bridge smoke scene; see the
        # export step for why the scene can't be passed on the CLI). The
        # contract is that scene's marker, printed only after real frames of
        # input/selection/move/HUD/cadence — not the load-time
        # "Initialize godot-rust" line, which a mid-run crash would survive.
        # Exit 139 after the contract held was the known Linux teardown race
        # (first appeared with the HPA-473 runtime-visibility commit): the
        # e2e feature's dep chain — bevy_e2e → bevy_remote (default http) →
        # bevy_tasks/async-io — spawns a process-global, permanently parked
        # self-waking async-io driver thread inside the .so, and Godot's
        # exit-path dlclose() of the extension faults that thread. The build
        # split keeps the e2e .so out of this packaged binary entirely, so
        # contract-held + nonzero exit is a real failure, never a warning.
        run: |
          set -o pipefail
          timeout 90s ./build/GrusSmoke.x86_64 --headless 2>&1 | tee export-smoke.log || rc=$?
          rc=${rc:-0}
          grep -q "Initialize godot-rust" export-smoke.log
          if grep -Eq "Failed to load.*GDExtension|Can't open dynamic library|Cannot open dynamic library" export-smoke.log; then
            echo "::error::exported build failed to load the Rust GDExtension"
            exit 1
          fi
          grep -q "GRUS_GODOT_SMOKE_OK" export-smoke.log || exit 1
          if [ "$rc" -ne 0 ]; then
            echo "::error::export smoke contract held but godot exited $rc"
            exit 1
          fi
      - name: Benchmark 200 moving units at 1080p
        # Runs before the e2e re-stage below so the benchmark exercises the
        # same strict-exit non-e2e .so as the smokes.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GRUS_BENCHMARK_SECONDS: "10"
        run: |
          echo "GRUS_BENCHMARK_HOST"
          uname -a
          lscpu | grep -E 'Architecture|CPU\(s\)|Model name'
          command -v xvfb-run
          set -o pipefail
          timeout 90s xvfb-run -a -s "-screen 0 1920x1080x24" godot --path godot --rendering-method gl_compatibility res://scenes/benchmark_200.tscn 2>&1 | tee benchmark.log || rc=$?
          rc=${rc:-0}
          grep -q "GRUS_BENCHMARK_200 start_units=200" benchmark.log || exit 1
          if [ "$rc" -ne 0 ]; then
            echo "::error::benchmark contract held but godot exited $rc"
            exit 1
          fi
      - name: Build e2e Godot extension
        # Built and staged only now that every strict-exit consumer has run.
        # The e2e feature (bevy_e2e → bevy_remote → bevy_tasks/async-io) is
        # what adds the self-waking async-io driver thread behind the known
        # dlclose teardown fault; the sole consumer of this .so is the
        # bevy-e2e export below.
        run: |
          cargo build -p grus-godot --features e2e --locked
          cp target/debug/libgrus_godot.so godot/bin/libgrus_godot.so
      - name: Export Linux x86_64 bevy-e2e build
        # Exports the real-main-scene binary with the e2e .so staged. Only
        # the bevy-e2e harness consumes it, and that harness SIGKILLs the
        # child — its teardown exit status is unasserted, so the e2e .so's
        # dlclose race cannot gate CI. project.godot was already restored by
        # the smoke export, so the main scene is the real one.
        run: |
          mkdir -p build
          godot --headless --path godot --export-debug "Linux x86_64" ../build/Grus.x86_64
          test -x build/Grus.x86_64
      - name: Run bevy-e2e exported-game test
        env:
          GRUS_E2E_BINARY: ${{ github.workspace }}/build/Grus.x86_64
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 \
          xvfb-run -a cargo test \
            -p grus-godot \
            --features e2e \
            --test e2e_boot \
            --locked \
            -- --test-threads=1
      - name: Capture teardown backtrace
        # Best-effort postmortem: if any step above failed, rerun the bridge
        # smoke under gdb and dump all thread backtraces so a recurring
        # teardown fault reports the faulting frame in the job log. The
        # staged .so is the e2e build by now, so first restore the pristine
        # non-e2e copy the smokes/benchmark actually ran. The 60s cap keeps
        # a wedged gdb/godot from hanging the job; failure here changes
        # nothing (the job is already red).
        if: failure()
        continue-on-error: true
        run: |
          command -v gdb || sudo apt-get install -y gdb
          cp target/libgrus_godot_noe2e.so godot/bin/libgrus_godot.so
          timeout 60s gdb -batch -ex run -ex 'thread apply all bt' --args godot --headless --path godot res://scenes/smoke_test.tscn
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-diagnostics
          path: |
            test_output/**
            *-smoke.log
            benchmark.log
